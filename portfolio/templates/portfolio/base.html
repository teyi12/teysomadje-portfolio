{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TeyiSomadje — Full Stack Web Developer. I build modern, scalable web applications with Python and Django."
    >

    <title>
        {% block title %}
        TeyiSomadje — Full Stack Web Developer
        {% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'portfolio/css/style.css' %}"
    >
</head>

<body>

    <!-- ========================================
         NAVBAR
    ========================================= -->

    <header class="site-header">

        <nav class="navbar navbar-expand-lg navbar-dark">

            <div class="container">

                <!-- Brand / Logo -->
                <a
                    class="navbar-brand brand"
                    href="{% url 'home' %}"
                >

                    <span class="brand-icon" aria-hidden="true">

    <svg
        class="brand-bee"
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
    >

        <!-- Wings -->
        <ellipse
            cx="20"
            cy="24"
            rx="11"
            ry="7"
            transform="rotate(-25 20 24)"
        />

        <ellipse
            cx="44"
            cy="24"
            rx="11"
            ry="7"
            transform="rotate(25 44 24)"
        />

        <!-- Body -->
        <ellipse
            class="bee-body"
            cx="32"
            cy="34"
            rx="14"
            ry="18"
        />

        <!-- Stripes -->
        <path
            class="bee-stripe"
            d="M21 29 C27 32, 37 32, 43 29"
        />

        <path
            class="bee-stripe"
            d="M20 37 C27 40, 37 40, 44 37"
        />

        <!-- Head -->
        <circle
            class="bee-head"
            cx="32"
            cy="17"
            r="9"
        />

        <!-- Eyes -->
        <circle cx="29" cy="16" r="1.5" />
        <circle cx="35" cy="16" r="1.5" />

        <!-- Antennas -->
        <path
            class="bee-line"
            d="M28 10 C24 5, 21 5, 19 7"
        />

        <path
            class="bee-line"
            d="M36 10 C40 5, 43 5, 45 7"
        />

    </svg>

</span>

                    <span class="brand-name">
                        Teyi<span>Somadje</span>
                    </span>

                </a>


                <!-- Mobile Toggle -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>


                <!-- Navigation -->
                <div
                    class="collapse navbar-collapse"
                    id="mainNavbar"
                >

                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#projects"
                            >
                                Work
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#about"
                            >
                                About
                            </a>
                        </li>

                        <li class="nav-item">
    <a
        class="nav-link"
        href="#stack"
    >
        Stack
    </a>
</li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#services"
                            >
                                Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#contact"
                            >
                                Contact
                            </a>
                        </li>

                    </ul>


                    <!-- CTA -->
                    <a
                        href="#contact"
                        class="nav-cta ms-lg-4 mt-3 mt-lg-0"
                    >
                        Let's talk
                    </a>

                </div>

            </div>

        </nav>

    </header>


    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-content">

                <p class="mb-0">
                    © 2026 TeyiSomadje.
                </p>

                <p class="mb-0">
                    Full Stack Web Developer
                </p>

            </div>

        </div>

    </footer>


    <!-- ========================================
         BOOTSTRAP JS
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ========================================
         CUSTOM JS
    ========================================= -->

    <script
        src="{% static 'portfolio/js/main.js' %}">
    </script>

</body>
</html>
