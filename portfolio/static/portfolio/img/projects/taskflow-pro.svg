      <text x="312" y="207" fill="#9aa3b2" font-size="10" font-weight="700">IN PROGRESS</text>
      <text x="454" y="207" fill="#9aa3b2" font-size="10" font-weight="700">COMPLETED</text>

      <g fill="#151b25" stroke="#28303c">
        <rect x="170" y="219" width="126" height="68" rx="10"/>
        <rect x="170" y="297" width="126" height="68" rx="10"/>
        <rect x="312" y="219" width="126" height="68" rx="10"/>
        <rect x="312" y="297" width="126" height="68" rx="10"/>
        <rect x="454" y="219" width="132" height="68" rx="10"/>
        <rect x="454" y="297" width="132" height="68" rx="10"/>
      </g>

      <g font-size="10" fill="#e5e7eb">
        <text x="182" y="244">Define user stories</text>
        <text x="182" y="322">Review analytics</text>
        <text x="324" y="244">Dashboard UI</text>
        <text x="324" y="322">API integration</text>
        <text x="466" y="244">Design system</text>
        <text x="466" y="322">Database schema</text>
      </g>
      <g fill="#5d6675">
        <rect x="182" y="255" width="66" height="4" rx="2"/>
        <rect x="182" y="333" width="79" height="4" rx="2"/>
        <rect x="324" y="255" width="71" height="4" rx="2"/>
        <rect x="324" y="333" width="58" height="4" rx="2"/>
        <rect x="466" y="255" width="64" height="4" rx="2"/>
        <rect x="466" y="333" width="76" height="4" rx="2"/>
      </g>
      <g>
        <circle cx="270" cy="270" r="8" fill="#8b5cf6"/>
        <circle cx="412" cy="270" r="8" fill="#06b6d4"/>
        <circle cx="554" cy="270" r="8" fill="#22c55e"/>
        <circle cx="270" cy="348" r="8" fill="#f97316"/>
        <circle cx="412" cy="348" r="8" fill="#ec4899"/>
        <circle cx="554" cy="348" r="8" fill="#3b82f6"/>
