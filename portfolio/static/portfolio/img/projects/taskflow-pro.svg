      <text x="184" y="158" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">24</text>
      <circle cx="271" cy="145" r="13" fill="#3b82f6" opacity=".14"/>
      <path d="M265 145h12M271 139v12" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>

      <rect x="308" y="112" width="126" height="62" rx="11" fill="#151b25" stroke="#28303c"/>
      <text x="322" y="133" fill="#7f899a" font-family="Arial, sans-serif" font-size="9">COMPLETED</text>
      <text x="322" y="158" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">68%</text>
      <circle cx="409" cy="145" r="13" fill="#22c55e" opacity=".14"/>
      <path d="m403 145 4 4 8-9" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="446" y="112" width="140" height="62" rx="11" fill="#151b25" stroke="#28303c"/>
      <text x="460" y="133" fill="#7f899a" font-family="Arial, sans-serif" font-size="9">TEAM VELOCITY</text>
      <text x="460" y="158" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">+12%</text>
      <path d="m534 158 12-12 9 5 15-19" fill="none" stroke="#f5c400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

