<svg xmlns="http://www.w3.org/2000/svg" width="640" height="427" viewBox="0 0 640 427" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow Pro dashboard preview</title>
  <desc id="desc">Dark project management dashboard with task columns and progress charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd21a"/>
      <stop offset="1" stop-color="#f5a900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="640" height="427" fill="url(#bg)"/>
  <circle cx="550" cy="40" r="170" fill="#f5c400" opacity=".06"/>
  <circle cx="80" cy="410" r="180" fill="#3b82f6" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="584" height="371" rx="18" fill="#0d1119" stroke="#29303c"/>
    <rect x="28" y="28" width="118" height="371" rx="18" fill="#090c12"/>
    <path d="M146 28v371" stroke="#252b35"/>

    <circle cx="56" cy="59" r="11" fill="url(#accent)"/>
    <path d="M51 59h10M56 54v10" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
    <text x="76" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="700">TaskFlow</text>

    <g fill="#70798a" font-family="Arial, sans-serif" font-size="10">
