      <text x="48" y="151">PROJECTS</text>
      <text x="48" y="191">MY TASKS</text>
      <text x="48" y="231">TEAM</text>
      <text x="48" y="271">REPORTS</text>
    </g>
    <rect x="39" y="91" width="98" height="30" rx="8" fill="#f5c400" opacity=".12"/>
    <rect x="39" y="91" width="3" height="30" rx="2" fill="#f5c400"/>
    <text x="48" y="111" fill="#f5c400" font-family="Arial, sans-serif" font-size="10" font-weight="700">OVERVIEW</text>

    <text x="170" y="67" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Product Launch</text>
    <text x="170" y="88" fill="#7f899a" font-family="Arial, sans-serif" font-size="10">Track tasks, owners and delivery progress</text>
    <rect x="508" y="49" width="78" height="30" rx="8" fill="url(#accent)"/>
    <text x="525" y="68" fill="#16120a" font-family="Arial, sans-serif" font-size="10" font-weight="700">+ New task</text>

    <g>
      <rect x="170" y="112" width="126" height="62" rx="11" fill="#151b25" stroke="#28303c"/>
